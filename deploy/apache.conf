## ====================================================================
## Apache 2.4 vhost для grats online control panel.
## Положите в /etc/apache2/sites-available/grats-panel.conf
## и активируйте: a2ensite grats-panel && systemctl reload apache2
## Требует включённых модулей: php (или proxy_fcgi для php-fpm), rewrite, headers, env, deflate
## ====================================================================

<VirtualHost *:8080>
    ServerName _

    DocumentRoot /var/www/grats-panel/public

    <Directory /var/www/grats-panel/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Не отдавать файлы выше public/
    <Directory /var/www/grats-panel>
        <FilesMatch "\.(php|json|env)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/grats-panel-error.log
    CustomLog ${APACHE_LOG_DIR}/grats-panel-access.log combined
</VirtualHost>
