## ====================================================================
## Nginx site config для grats online control panel.
## Положите в /etc/nginx/sites-available/grats-panel
## и слинкуйте: ln -s ../sites-available/grats-panel /etc/nginx/sites-enabled/
## ====================================================================

server {
    listen 8080;
    server_name _;

    # ВАЖНО: путь к папке public/ (НЕ к корню проекта)
    root /var/www/grats-panel/public;
    index index.php;

    client_max_body_size 2M;

    # Запретить доступ к скрытым файлам, .git и т.п.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # SSE: отключить буферизацию для лог-стрима
    location = /api/console.php {
        gzip off;
        proxy_buffering off;
        fastcgi_buffering off;
        fastcgi_keep_conn on;
        fastcgi_read_timeout 86400s;

        include snippets/fastcgi-php.conf;

        # ВАЖНО: проверьте версию php-fpm (php8.1, php8.2, php8.3, php8.4):
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # ВАЖНО: проверьте версию php-fpm (php8.1, php8.2, php8.3, php8.4):
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }
}
